<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Happy Women's Day 💌</title>
        <link rel="stylesheet" href="./index.css" />
        <style>
            /* ============ Thư ============ */
            .letter-overlay {
                position: fixed;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                background: linear-gradient(135deg, #ffe6ef, #fff0f5);
                z-index: 100;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.6s ease;
            }

            .letter-overlay.show {
                opacity: 1;
                pointer-events: auto;
            }

            .letter {
                background: #fff;
                padding: 40px 50px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
                max-width: 520px;
                text-align: center;
                animation: fadeInUp 1s ease;
            }

            .letter h1 {
                font-family: "Great Vibes", cursive;
                font-size: 2.5rem;
                color: #ff69b4;
                margin-bottom: 20px;
            }

            .letter p {
                font-size: 1.1rem;
                color: #555;
                line-height: 1.7;
                min-height: 120px;
            }

            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* ============ Màn che khi chuyển trang ============ */
            .fade-screen {
                position: fixed;
                inset: 0;
                background: #fff;
                opacity: 0;
                z-index: 999;
                pointer-events: none;
                transition: opacity 1s ease;
            }

            .fade-screen.active {
                opacity: 1;
                pointer-events: all;
            }
        </style>
    </head>

    <body>
        <h1>🎉 Chúc mừng 🎉</h1>
        <h1>Ngày Phụ nữ Việt Nam 20/10</h1>
        <button id="gift-btn">Bấm để nhận quà 💌</button>

        <!-- Bức thư -->
        <div class="letter-overlay" id="letterBox">
            <div class="letter">
                <h1>Lời chúc dành cho cô và các bạn nữ</h1>
                <p id="letterText"></p>
            </div>
        </div>

        <!-- Lớp phủ trắng để chuyển trang mượt -->
        <div class="fade-screen" id="fadeScreen"></div>

        <script>
            const btn = document.getElementById("gift-btn");
            const letterBox = document.getElementById("letterBox");
            const textElement = document.getElementById("letterText");
            const fadeScreen = document.getElementById("fadeScreen");

            const message = `Nhân ngày Phụ nữ Việt Nam 20/10, em xin kính chúc cô và các bạn nữ trong lớp luôn xinh đẹp, rạng rỡ và tràn đầy niềm vui.
Chúc cô luôn mạnh khỏe, hạnh phúc và thành công trong sự nghiệp trồng người cao quý 🌷.
Chúc các bạn nữ mãi là những đóa hoa tươi thắm, luôn tỏa sắc, tự tin, học giỏi và gặp nhiều may mắn trong cuộc sống 💖`;

            btn.addEventListener("click", () => {
                // Hiện thư
                letterBox.classList.add("show");
                document.body.style.overflow = "hidden";

                // Gõ chữ
                let i = 0;
                function typeWriter() {
                    if (i < message.length) {
                        textElement.innerHTML += message.charAt(i);
                        i++;
                        setTimeout(typeWriter, 60);
                    } else {
                        // Sau khi gõ xong, chờ 3 giây rồi fade sang trang hoa
                        setTimeout(() => {
                            fadeScreen.classList.add("active");
                            // Khi màn trắng phủ hết thì chuyển trang
                            setTimeout(() => {
                                window.location.href = "flower.html";
                            }, 1000); // trùng với transition 1s
                        }, 1000);
                    }
                }
                typeWriter();
            });
        </script>
    </body>
</html>
